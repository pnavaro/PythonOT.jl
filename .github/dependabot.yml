# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
  - package-ecosystem: julia
    directories:
      - /
      - /docs
      - /test
    schedule:
      interval: weekly
    open-pull-requests-limit: 99
